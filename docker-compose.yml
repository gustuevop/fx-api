services:
  redis:
    image: redis:alpine
    container_name: fx-redis-cache
    ports:
      - "6379:6379"
    restart: always

  mongodb:
    image: mongo:latest
    container_name: fx-mongo-database
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    restart: always

  localstack:
    image: localstack/localstack:3.4.0
    container_name: fx-localstack-aws
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "fx_localstack_data:/var/lib/localstack"

volumes:
  fx_localstack_data: